name: DevOps Assembly Line

on:
	push:
		branches:
			- main
			- develop
	pull_request:
		branches:
			- main
jobs:
	lint:
		runs-on: ubuntu-latest
		
		steps:
			- name: Checkout Source Code
			  uses: actions/checkout@v4
			
			- name: Install Dependencies
			  run: npm install
			
			- name: Run Lint
			  run: npm run lint
	test:
		runs-on: ubuntu-latest
		
		steps:
			- name: Checkout Source Code
			  uses: actions/checkout@v4
			
			- name: Install Dependencies
			  run: npm install
			
			- name: Run Tests
			  run: npm test
	
	security-scan:
		runs-on: ubuntu-latest
		
		steps:
			- name: Checkout Source Code
			  uses: actions/checkout@v4
			
			- name: Run Trivy Security Scan
			  uses: aquasecurity/trivy-action@mastr
			
			with:
				scan-type: 'fs'
				exit-code: '1'
	
	build:
		needs:
			- lint
			- test
			- security-scan
		
		runs-on: ubuntu-latest
		
		steps:
			- name: Checkout Source Code
			  uses: actions/checkout@v4
			
			- name: Build Application
			  run: npm run build
			  
	deploy-production:
		runs-on: ubuntu-latest
		environment: production
		
		env:
		 PROD_API_KEY: ${{ secrets.PROD_API_KEY}}
		 setps:
		 	- run: echo Deploying with Production key
		 	
	smoke-test:
		runs-on: ubuntu-latest
		needs: build
		
		steps:
			- name: Simulate Smoke Test
			  run: exit 1
			  
			- name: Rollback Deployment
			  if: failure()
			  run: echo "Smoke Test Failed - Rolling Back Deployment"
